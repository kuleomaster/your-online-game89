<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Block Sandbox 2</title>
<style>
:root{--ui:rgba(18,22,30,.86);--line:rgba(255,255,255,.4);--hi:#ffd36b;--tx:#f4f6fa;--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
*{box-sizing:border-box}

canvas{display:block}
.h2{position:fixed;pointer-events:none;text-shadow:0 1px 3px #000}
#cross{left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;mix-blend-mode:difference}
#cross:before{left:8px;top:0;width:2px;height:18px}#cross:after{top:8px;left:0;height:2px;width:18px}
#hp{left:12px;top:calc(10px + var(--st));font-size:20px;color:#ff5a5a;letter-spacing:1px}
#info{left:50%;transform:translateX(-50%);top:calc(10px + var(--st));font-size:13px}
#who{right:calc(12px + var(--sr));top:calc(66px + var(--st));font-size:12px;text-align:right;line-height:1.5}
#toast{left:50%;top:22%;transform:translateX(-50%);font:700 19px system-ui;opacity:0;transition:opacity .4s;text-align:center}
#mine{left:50%;top:56%;width:120px;height:8px;margin-left:-60px;background:rgba(0,0,0,.5);border-radius:4px;overflow:hidden}
#mine i{display:block;height:100%;width:0;background:var(--hi)}
#fl{position:fixed;inset:0;background:#e00;opacity:0;transition:opacity .15s;pointer-events:none}
#tags{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tg{position:absolute;transform:translate(-50%,-100%);padding:2px 8px;background:rgba(0,0,0,.55);border-radius:6px;font:600 12px system-ui;white-space:nowrap}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + var(--sb));display:flex;gap:3px;padding:4px;background:var(--ui);border-radius:8px;z-index:5}
.sl{width:46px;height:46px;border:3px solid var(--line);border-radius:5px;position:relative;cursor:pointer;background:rgba(255,255,255,.07) center/78% no-repeat;image-rendering:pixelated;flex:none}
.ph .sl{width:50px;height:50px}
.sl.on{border-color:var(--hi)}#bar .sl.on{transform:translateY(-4px)}
.sl b{position:absolute;left:2px;top:-1px;font-size:10px;text-shadow:0 1px 2px #000}
.sl i{position:absolute;right:2px;bottom:0;font:700 11px system-ui;text-shadow:0 1px 2px #000}
.sl u{position:absolute;left:3px;bottom:1px;height:3px;background:#5f5;border-radius:2px}
#ov,#inv{position:fixed;inset:0;display:flex;overflow:auto;touch-action:pan-y}
#ov{background:rgba(8,14,22,.6);z-index:9}#inv{background:rgba(8,12,20,.72);z-index:8}
section{margin:auto;padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;max-width:94vw}
h1{margin:0;font-size:clamp(28px,6vw,54px);letter-spacing:.02em;text-shadow:0 3px 0 #0006}h2{margin:0}p{margin:0;max-width:46ch;line-height:1.5}
button,input{font:600 16px system-ui;border-radius:8px;border:2px solid var(--line);background:var(--ui);color:var(--tx)}
button{padding:10px 20px;min-width:250px;cursor:pointer}button:hover,.rec{border-color:var(--hi)}
input{padding:9px 10px;font-weight:500;width:100%;user-select:text;-webkit-user-select:text}input[type=color]{width:54px;padding:2px;height:42px}
button small{display:block;font-weight:400;font-size:12px;opacity:.8;margin-top:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;width:100%}
.card{display:flex;flex-direction:column;gap:8px;width:min(420px,92vw);padding:14px;background:var(--ui);border:2px solid var(--line);border-radius:10px}
.card label{display:flex;flex-direction:column;gap:4px;font-size:12px;text-align:left;flex:1}

.kr{display:flex;justify-content:space-between;align-items:center;gap:16px;width:min(420px,88vw)}.kr button{min-width:120px;padding:6px 10px;font-size:14px}
.ph #ov button{padding:8px 16px;font-size:15px;min-width:200px}

#ig{display:grid;grid-template-columns:repeat(9,auto);gap:3px;align-content:start}
#ir{flex:1;min-width:260px;display:flex;flex-direction:column;gap:8px}
#il{overflow:auto;max-height:52vh;display:flex;flex-direction:column;gap:4px}
#il.g{flex-direction:row;flex-wrap:wrap;gap:3px}
.rw{display:flex;align-items:center;gap:8px;padding:4px 8px;border:2px solid var(--line);border-radius:6px;font-size:13px;text-align:left;cursor:pointer}.rw.no{opacity:.45}.rw.ok{border-color:#6f6}
.rw .sl{width:34px;height:34px;border-width:2px}.tab{min-width:0;padding:6px 14px;font-size:14px}
#held{position:fixed;width:40px;height:40px;pointer-events:none;z-index:20;background:center/80% no-repeat;image-rendering:pixelated}
#tc{position:fixed;inset:0;pointer-events:none;z-index:4}
#jz{position:absolute;left:0;bottom:0;width:45%;height:70%;pointer-events:auto}#lz{position:absolute;right:0;top:0;width:55%;height:100%;pointer-events:auto}
#ring{position:absolute;width:100px;height:100px;border:2px solid var(--line);border-radius:50%;display:none}
#knob{position:absolute;left:30px;top:30px;width:40px;height:40px;border-radius:50%;background:var(--line)}
.tb{position:absolute;width:64px;height:64px;min-width:0;padding:0;border-radius:50%;font-size:13px;pointer-events:auto;touch-action:none}
.tb.sm{width:48px;height:48px;font-size:11px}.tb.big{width:76px;height:76px;font-size:15px}
</style>
</head>
<body>
<div id="tags"></div>
<div id="cross" class="h2" hidden></div><div id="hp" class="h2" hidden></div><div id="info" class="h2" hidden></div><div id="who" class="h2" hidden></div>
<div id="toast" class="h2"></div><div id="mine" class="h2" hidden><i></i></div><div id="fl"></div>
<div id="bar" hidden></div><div id="held" hidden></div>
<div id="tc" hidden>
  <div id="jz"></div><div id="lz"></div><div id="ring"><div id="knob"></div></div>
  <button class="tb big" id="t-brk" style="right:calc(22px + var(--sr));bottom:calc(36px + var(--sb))">Break</button>
  <button class="tb big" id="t-jump" style="right:calc(112px + var(--sr));bottom:calc(22px + var(--sb))">Jump</button>
  <button class="tb" id="t-plc" style="right:calc(30px + var(--sr));bottom:calc(126px + var(--sb))">Place</button>

  <button class="tb sm" id="t-inv" style="right:calc(66px + var(--sr));top:calc(10px + var(--st))">Items</button>
  <button class="tb sm" id="t-fly" style="right:calc(12px + var(--sr));top:calc(64px + var(--st))" hidden>Fly</button>
  <button class="tb sm" id="t-dn" style="right:calc(12px + var(--sr));top:calc(118px + var(--st))" hidden>Down</button>
</div>
<div id="inv" hidden><div id="ip">
  <div style="display:flex;flex-direction:column;gap:8px"><b>Inventory</b><div id="ig"></div><div style="font-size:12px;opacity:.8">Tap a stack, then tap another slot to move it.</div><button id="i-x" style="min-width:0">Close</button></div>
  <div id="ir"><div class="row" style="justify-content:flex-start"><button class="tab" id="tb-c">Crafting</button><button class="tab" id="tb-p">Creative items</button><input id="i-q" placeholder="Search..." style="flex:1;min-width:120px"></div><div id="il"></div></div>
</div></div>
<div id="ov">
  <section id="s-dev"><h1>Block Sandbox 2</h1><p>First, which device are you on?</p>
    <div class="row"><button id="d-pc">PC<small>keyboard and mouse</small></button><button id="d-ph">Phone<small>touch controls, hold it sideways</small></button></div></section>
  <section id="s-menu" hidden><h1>Block Sandbox 2</h1>
    <div class="card"><div class="row"><label>Nickname<input id="nick" maxlength="14" autocomplete="off"></label><label style="flex:0 0 64px">Color<input id="ncol" type="color" value="#e8a13a"></label></div>
    <label>Multiplayer room code (leave empty to play alone)<input id="room" maxlength="16" placeholder="e.g. FRIENDS1" autocomplete="off"></label><div id="mp-st"></div></div>
    <button id="b-res" hidden>Resume</button>
    <button id="b-surv">Survival<small>health, mining, crafting, mobs at night</small></button>
    <button id="b-crea">Creative<small>every block and item, flying, instant mining</small></button>
    <div class="row"><button id="b-keys" style="min-width:120px">Controls</button><button id="b-snd" style="min-width:120px"></button><button id="b-dev" style="min-width:120px">Device</button></div>
    <p id="help"></p><p id="stat" style="font-size:12px;opacity:.75"></p></section>
  <section id="s-keys" hidden><h2>Controls</h2><div id="kl"></div>
    <div class="row"><button id="k-reset" style="min-width:120px">Reset</button><button id="k-back" style="min-width:120px">Back</button></div></section>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

const myName=()=>($('nick').value.trim().slice(0,14)||'Player'),myCol=()=>$('ncol').value;
const hashStr=s=>{let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))%2147483000;return h+1;};
function applyEdits(e){if(!Array.isArray(e))return;let ch=new Set();for(const a of e){if(!Array.isArray(a)||a.length!=4)continue;const[x,y,z,v]=a;if([x,y,z,v].every(Number.isInteger)&&v>=0&&v<BL.length&&inb(x,y,z)&&BL[v]&&(v==0||BL[v].k=='b')){V[idx(x,y,z)]=v;edits.set(x+','+y+','+z,[x,y,z,v]);ch.add((x>>4)+','+(z>>4));}}ch.forEach(k=>{const[a,b]=k.split(',').map(Number);build(a,b);});}
function leader(){if(!room)return false;const ps=room.peers().filter(p=>p.kind=='viewer').sort((a,b)=>a.peer<b.peer?-1:1);return ps.length&&ps[0].isMe&&ps[0].sameTab;}
function sendLog(){const arr=[...edits.values()];for(let i=0;i<arr.length;i+=120)setTimeout(()=>room&&room.emit('syn',{e:arr.slice(i,i+120)}).catch(()=>{}),i/120*150);}
async function netJoin(code){netSt='Connecting...';$('mp-st').textContent=netSt;
  try{const r=(typeof claude!=='undefined'&&claude.use)?await claude.use('room'):null;if(!r){netOn=false;netSt='Online play is not available on this page. Open the published link while signed in. Playing alone.';return false;}
    room=await r.join('bs'+code.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,20));netOn=true;
    room.on('blk',m=>{if(!m.sameTab)applyEdits(m.data&&m.data.e);});room.on('syn',m=>{if(!m.sameTab)applyEdits(m.data&&m.data.e);});
    room.onPeers(ch=>{if(ch.joined.some(p=>!p.isMe)&&leader())sendLog();});netSt='Online in room '+code;return true;}
  catch(e){netOn=false;room=null;netSt='Could not join the room. Playing alone.';return false;}}
function mkAvatar(col){const g=new THREE.Group(),P=(w,h,d,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:c}));m.position.set(x,y,z);g.add(m);};
  P(.5,.5,.5,0xf0c090,0,1.55,0);P(.55,.75,.3,col,0,.97,0);P(.22,.7,.22,0x3a4a8a,-.14,.35,0);P(.22,.7,.22,0x3a4a8a,.14,.35,0);P(.2,.7,.2,col,-.4,1,0);P(.2,.7,.2,col,.4,1,0);scene.add(g);return g;}
let pT=0;
function netTick(dt){if(!netOn||!room)return;pT+=dt;if(pT>=.1){pT=0;room.presence({n:myName(),c:myCol(),x:+px.toFixed(2),y:+py.toFixed(2),z:+pz.toFixed(2),a:+yaw.toFixed(2)}).catch(()=>{});
    if(out.length)room.emit('blk',{e:out.splice(0,120)}).catch(()=>{});}
  const seen=new Set(),names=[myName()+' (you)'];
  for(const p of room.peers()){if(p.isMe||p.kind!='viewer')continue;const q=p.presence||{};if(typeof q.x!='number'||typeof q.z!='number')continue;seen.add(p.peer);
    let a=avs.get(p.peer);if(!a){const c=/^#[0-9a-f]{6}$/i.test(q.c)?parseInt(q.c.slice(1),16):0xe8a13a,tg=ce('div','tg');a={g:mkAvatar(c),tg};$('tags').appendChild(tg);avs.set(p.peer,a);}
    const nm=String(q.n||'Player').replace(/[<>&"]/g,'').slice(0,14);a.tg.textContent=nm;names.push(nm);
    a.g.position.x+=(q.x-a.g.position.x)*.35||0;a.g.position.y+=(q.y-a.g.position.y)*.35||0;a.g.position.z+=(q.z-a.g.position.z)*.35||0;if(typeof q.a=='number')a.g.rotation.y=q.a;a.pos=a.g.position;}
  for(const[k,a]of avs)if(!seen.has(k)){scene.remove(a.g);a.tg.remove();avs.delete(k);}
  const v=new THREE.Vector3();for(const a of avs.values()){v.set(a.g.position.x,a.g.position.y+2.1,a.g.position.z).project(camera);a.tg.style.display=v.z<1?'block':'none';a.tg.style.left=(v.x*.5+.5)*innerWidth+'px';a.tg.style.top=(-v.y*.5+.5)*innerHeight+'px';}
  $('who').innerHTML=names.join('<br>');}
// ---------- Menus and keybinds ----------
const HELP={pc:'Hold left click to mine or hit, right click to place or use. E opens your inventory and crafting. 1 to 9 or the wheel pick a slot. Esc opens this menu.',phone:'Left side walks, right side looks. Tap to place, hold to mine, or use the buttons. Items opens your inventory and crafting.'};
const DB={fwd:'KeyW',back:'KeyS',left:'KeyA',right:'KeyD',jump:'Space',sprint:'ShiftLeft',down:'KeyC',fly:'KeyF',inv:'KeyE'};
const LB=[['fwd','Move forward'],['back','Move back'],['left','Move left'],['right','Move right'],['jump','Jump or fly up'],['sprint','Sprint'],['down','Fly down'],['fly','Toggle flying'],['inv','Inventory']];
let bd={...DB};try{Object.assign(bd,JSON.parse(localStorage.getItem('bs2k')||'{}'));}catch(_){}
const saveK=()=>{try{localStorage.setItem('bs2k',JSON.stringify(bd));}catch(_){}};
const nm=c=>c.replace(/^Key|^Digit/,'').replace(/(Left|Right)$/,m=>' '+m[0]);
function drawKeys(){const kl=$('kl');kl.innerHTML='';LB.forEach(([id,t])=>{const r=ce('div','kr',`<span>${t}</span>`),b=ce('button','',capture==id?'Press a key':nm(bd[id]));b.onclick=()=>{capture=id;drawKeys();};r.appendChild(b);kl.appendChild(r);});}
const scr=n=>['dev','menu','keys'].forEach(s=>$('s-'+s).hidden=s!=n);
function hud(on){['cross','bar','info','who'].forEach(i=>$(i).hidden=!on);$('who').hidden=!(on&&netOn);$('hp').hidden=!(on&&mode=='survival');$('tc').hidden=!(on&&dev=='phone');$('t-fly').hidden=mode!='creative';$('t-dn').hidden=!(fly&&dev=='phone');$('tags').style.display=on?'block':'none';if(!on){hl.visible=false;$('mine').hidden=true;}}
function show(n){playing=false;for(const k in keys)keys[k]=0;try{document.exitPointerLock();}catch(_){}openInv(false);$('ov').hidden=false;scr(n);hud(false);$('b-res').hidden=!started;$('mp-st').textContent=netSt;}
function play(){$('ov').hidden=true;playing=true;hud(true);audio();drawBar();if(dev=='pc'){try{cv.requestPointerLock();}catch(_){}}else{toast('Drag to look, tap to place, hold to mine');try{const r=document.documentElement.requestFullscreen();if(r&&r.catch)r.catch(()=>{});}catch(_){}}}
async function start(m){audio();mode=m;try{localStorage.setItem('bs2n',myName());}catch(_){}
  const code=$('room').value.trim();let s=Math.floor(Math.random()*2e9)+1;
  if(code){s=hashStr(code.toLowerCase());await netJoin(code);}else{netOn=false;room=null;netSt='';}
  edits.clear();out=[];while(mobs.length)killMob(0);inv.fill(null);held=null;gen(s);reset();tod=.05;lab='';started=true;
  if(m=='creative')['Grass Block','Stone','Oak Planks','Oak Log','Glass','Diamond Pickaxe','Torch'].forEach(n=>{if(ID[n]!=null)addItem(ID[n],ID[n]&&BL[ID[n]].dur?1:64);});
  slot=0;for(let i=0;i<8;i++)spawnMob(false);drawBar();drawHP();play();}
function setDev(d){dev=d;document.body.classList.toggle('ph',d=='phone');$('help').textContent=HELP[d];$('b-keys').hidden=d=='phone';scr('menu');}
$(matchMedia('(pointer:coarse)').matches?'d-ph':'d-pc').classList.add('rec');
$('d-pc').onclick=()=>setDev('pc');$('d-ph').onclick=()=>setDev('phone');$('b-res').onclick=play;$('b-surv').onclick=()=>start('survival');$('b-crea').onclick=()=>start('creative');$('b-dev').onclick=()=>scr('dev');
$('b-keys').onclick=()=>{scr('keys');drawKeys();};$('k-back').onclick=()=>{capture=null;scr('menu');};$('k-reset').onclick=()=>{bd={...DB};saveK();drawKeys();};
$('b-snd').onclick=()=>{sndOn=!sndOn;$('b-snd').textContent='Sound: '+(sndOn?'on':'off');audio();snd('ui');};$('b-snd').textContent='Sound: on';
try{$('nick').value=localStorage.getItem('bs2n')||'';}catch(_){}
$('stat').textContent=BL.length.toLocaleString()+' blocks and items, '+MOBS.length+' mobs, '+ORE.length+' ores, '+REC.length+' recipes';
// ---------- PC input ----------
addEventListener('keydown',e=>{if(e.target&&e.target.tagName=='INPUT')return;
  if(capture){if(e.code!='Escape'){bd[capture]=e.code;saveK();}capture=null;drawKeys();e.preventDefault();return;}
  keys[e.code]=1;if(!started)return;if(e.code==bd.inv&&(playing||invOpen)){openInv(!invOpen);if(invOpen)playing=true;e.preventDefault();return;}
  if(!playing)return;if(e.code=='Escape')show('menu');if(e.code==bd.fly)toggleFly();if(/^Digit[1-9]$/.test(e.code))sel(+e.code[5]-1);if(e.code=='Space'||e.code.startsWith('Arrow'))e.preventDefault();});
addEventListener('keyup',e=>{keys[e.code]=0;});
addEventListener('mousemove',e=>{if(!document.pointerLockElement)return;yaw-=e.movementX*.0022*[.6,1,1.6][sens];pitch=cl(-1.5,1.5,pitch-e.movementY*.0022*[.6,1,1.6][sens]);});
addEventListener('mousedown',e=>{if(!playing||invOpen||dev!='pc'||e.target.closest('#bar'))return;if(e.button==0){act(0);brk=1;bt=.3;}else if(e.button==2)act(1);});
addEventListener('mouseup',e=>{if(e.button==0)brk=0;});
addEventListener('wheel',e=>{if(playing&&!invOpen&&dev=='pc'){slot=(slot+(e.deltaY>0?1:8))%9;drawBar();}});
addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('pointerlockchange',()=>{if(!document.pointerLockElement&&playing&&dev=='pc'&&!invOpen)show('menu');});
cv.addEventListener('click',()=>{if(playing&&dev=='pc'&&!invOpen&&!document.pointerLockElement){try{cv.requestPointerLock();}catch(_){}}});
// ---------- Phone input ----------
const jz=$('jz'),ring=$('ring'),knob=$('knob'),lz=$('lz');let jid=null,jo=[0,0];
jz.onpointerdown=e=>{jid=e.pointerId;jz.setPointerCapture(jid);jo=[e.clientX,e.clientY];ring.style.display='block';ring.style.left=jo[0]-50+'px';ring.style.top=jo[1]-50+'px';};
jz.onpointermove=e=>{if(e.pointerId!=jid)return;let dx=e.clientX-jo[0],dy=e.clientY-jo[1];const l=Math.hypot(dx,dy);if(l>50){dx*=50/l;dy*=50/l;}tj=[dx/50,dy/50];knob.style.transform=`translate(${dx}px,${dy}px)`;};
jz.onpointerup=jz.onpointercancel=e=>{if(e.pointerId!=jid)return;jid=null;tj=[0,0];ring.style.display='none';knob.style.transform='';};
lz.onpointerdown=e=>{lid=e.pointerId;lz.setPointerCapture(lid);lx=e.clientX;ly=e.clientY;lt=performance.now();lm=0;brkL=0;};
lz.onpointermove=e=>{if(e.pointerId!=lid)return;const dx=e.clientX-lx,dy=e.clientY-ly;lm+=Math.abs(dx)+Math.abs(dy);yaw-=dx*.006*[.6,1,1.6][sens];pitch=cl(-1.5,1.5,pitch-dy*.006*[.6,1,1.6][sens]);lx=e.clientX;ly=e.clientY;if(lm>14)brkL=0;};
lz.onpointerup=lz.onpointercancel=e=>{if(e.pointerId!=lid)return;lid=null;if(brkL)brkL=0;else if(lm<14&&performance.now()-lt<300)act(1);};
const hold=(id,on,off)=>{const b=$(id);b.onpointerdown=e=>{e.preventDefault();on();};b.onpointerup=b.onpointercancel=b.onpointerleave=()=>off&&off();};
hold('t-jump',()=>tjump=1,()=>tjump=0);hold('t-brk',()=>{act(0);brk=1;bt=.3;},()=>brk=0);hold('t-plc',()=>act(1));hold('t-fly',toggleFly);hold('t-dn',()=>tdn=1,()=>tdn=0);
$('t-menu').onclick=()=>show('menu');$('t-inv').onclick=()=>{openInv(true);};
// ---------- Game loop ----------
let last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;
  if(playing){
    if(!invOpen){yaw+=((keys.ArrowLeft?1:0)-(keys.ArrowRight?1:0))*2*dt;pitch=cl(-1.5,1.5,pitch+((keys.ArrowUp?1:0)-(keys.ArrowDown?1:0))*1.6*dt);
      let f=(keys[bd.fwd]?1:0)-(keys[bd.back]?1:0)-tj[1],s=(keys[bd.right]?1:0)-(keys[bd.left]?1:0)+tj[0];const l=Math.hypot(f,s);if(l>1){f/=l;s/=l;}
      const sp=fly?9:(keys[bd.sprint]||(dev=='phone'&&l>.97))?6.4:4.4,sn=Math.sin(yaw),cs=Math.cos(yaw),vx=(-sn*f+cs*s)*sp,vz=(-cs*f-sn*s)*sp;
      const up=keys[bd.jump]||tjump,dn=keys[bd.down]||tdn;
      if(fly)vy=((up?1:0)-(dn?1:0))*7;else{if(up&&ground){vy=8.2;ground=false;}vy=Math.max(-20,vy-26*dt);}
      if(!hit(px+vx*dt,py,pz,R_,HT))px+=vx*dt;if(!hit(px,py,pz+vz*dt,R_,HT))pz+=vz*dt;
      if(!hit(px,py+vy*dt,pz,R_,HT)){py+=vy*dt;ground=false;}else{if(!fly&&vy<-13)hurt(Math.floor((-vy-12)/1.5)+1);ground=vy<0&&!fly;vy=0;}
      if(ground&&Math.hypot(vx,vz)>.5){stepD+=Math.hypot(vx,vz)*dt;if(stepD>1.9){stepD=0;const b=BL[get(Math.floor(px),Math.floor(py-.2),Math.floor(pz))];snd('step',b?b.sn:0);}}
      if(py<-5)reset();
      const on=brk||brkL||false;if(lid!=null&&!brkL&&lm<14&&performance.now()-lt>300)brkL=1;
      if(mode=='creative'){if(on){bt-=dt;if(bt<=0){act(0);bt=.25;}}}else{const pk=mineStep(dt,on);if(!on){mineK='';$('mine').hidden=true;}void pk;}
      const pk2=pick();hl.visible=!!pk2;if(pk2)hl.position.set(pk2.x+.5,pk2.y+.5,pk2.z+.5);}
    rgn+=dt;if(mode=='survival'&&hp<20&&rgn>4){hp++;rgn=0;drawHP();}
    updMobs(dt);spawnTick(dt);fallTick(dt);sky(dt);netTick(dt);
    const l=(mode=='survival'?'Survival':'Creative')+(night?', night':', day')+(netOn?', online':'');if(l!=lab){lab=l;$('info').textContent=l;}
  }else yaw+=dt*.1;
  camera.position.set(px,py+EYE,pz);camera.rotation.set(pitch,yaw,0);renderer.render(scene,camera);}
gen(12345);reset();scr('dev');requestAnimationFrame(frame);
</script>
